<style>

/* INTRO: EL MISMO VIDEO ENTREGADO */

/* VISTA 1 */

.bg-video{position:absolute;inset:-7%;width:114%;height:114%;object-fit:cover;z-index:0;filter:blur(14px) saturate(1.2) brightness(.62);opacity:.75;transform:scale(1.04)}
.bg-overlay{position:absolute;inset:0;z-index:1;background:radial-gradient(circle at 50% 35%,rgba(245,196,0,.25),transparent 48%),linear-gradient(180deg,rgba(4,18,43,.15),rgba(3,12,29,.5) 52%,rgba(2,9,24,.96) 100%)}
.topbar{position:relative;z-index:5;height:var(--top);display:flex;align-items:center;justify-content:space-between;padding:8px clamp(12px,3vw,32px)}
.station-title{font-size:clamp(16px,3.5vw,31px);font-weight:900;letter-spacing:-.7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-logo{width:46px;height:46px;border-radius:14px;background:#fff;padding:3px;object-fit:contain;flex-shrink:0}
.share-head{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--yellow);color:var(--blue);font-size:20px;box-shadow:0 7px 20px rgba(0,0,0,.25)}

.content{position:relative;z-index:4;flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:10px;padding:4px clamp(10px,2.5vw,28px) 24px;max-width:1250px;width:100%;margin:auto}
.hero{min-height:0;position:relative;overflow:visible;display:flex;align-items:center;justify-content:center;padding:4px;background:transparent;border:0;box-shadow:none}
}
.hero-logo{position:relative;z-index:2;width:min(56%,430px);max-height:76%;object-fit:contain;filter:drop-shadow(0 15px 24px rgba(0,0,0,.48));animation:logoPulse 2.8s ease-in-out infinite}@keyframes logoPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.social-row{display:flex;align-items:center;justify-content:center;gap:12px;height:48px}.social-row a,.social-row button{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(5,18,43,.72);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:17px;transition:.18s;box-shadow:0 5px 15px rgba(0,0,0,.25)}.social-row a:hover,.social-row button:hover{background:var(--yellow);color:var(--blue);transform:translateY(-2px) scale(1.05)}

.mini-play{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--yellow);color:var(--blue);font-size:19px;flex-shrink:0}.mini-vol{width:36px;height:36px;border-radius:50%;background:transparent;color:#fff;display:none}@media(min-width:600px){.mini-vol{display:grid;place-items:center}}

/* VISTA 2 — MISMO PLAYER DEL HTML SOLICITADO, ADAPTADO A TEO PÁEZ */
#player{position:fixed;inset:0;z-index:200;background:linear-gradient(145deg,#fff,#f3f7ff);color:var(--dark);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}#player.open{transform:translateY(0)}
.player-top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #dce7fb;background:#fff}.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#edf3ff;color:var(--blue);font-size:18px}.player-top-title{font-weight:900;font-size:clamp(14px,3vw,22px)}.player-logo-top{width:43px;height:43px;border-radius:11px;object-fit:contain}
.player-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:17px;padding:20px 18px 35px}.disc-wrap{position:relative;width:min(62vw,300px);aspect-ratio:1}.disc{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,#f5c400 0 42%,#075bc7 43% 47%,#fff 48% 50%,#063b91 51% 100%);border:7px solid #063b91;display:flex;align-items:center;justify-content:center;box-shadow:0 22px 50px #063b9140}.disc.spinning{animation:spin 8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.disc-core{width:43%;height:43%;border-radius:50%;background:#fff;border:4px solid var(--yellow);overflow:hidden;display:flex;align-items:center;justify-content:center}.disc-core img{width:100%;height:100%;object-fit:contain}
.player-info h1{font-size:clamp(21px,5vw,31px);font-weight:900;color:var(--blue);margin:0}.player-info p{margin:6px 0 0;color:#5b6b83;font-size:13px}.on-air{display:inline-flex;align-items:center;gap:7px;padding:8px 18px;border-radius:999px;background:var(--yellow);color:var(--blue);font-weight:900;font-size:12px}.controls{display:flex;align-items:center;justify-content:center;gap:25px}.round{background:none;color:var(--blue);font-size:22px;width:42px;height:42px;border-radius:50%}.main-play{width:78px;height:78px;border-radius:50%;background:var(--blue);color:#fff;font-size:27px;box-shadow:0 12px 30px #063b9140}.volume-row{display:flex;align-items:center;gap:10px;width:min(100%,240px)}.volume-row input{width:100%;accent-color:var(--blue)}#status{font-size:12px;color:#65748a;min-height:15px}.player-share{display:flex;gap:9px}.player-share button{width:38px;height:38px;border-radius:50%;background:#edf3ff;color:var(--blue)}

@media(max-width:700px){.content{padding:2px 8px 22px;gap:6px;grid-template-rows:minmax(0,1fr) auto auto}.hero{padding:0;margin-top:-4px}.hero-logo{width:min(72%,330px);max-height:70%}.social-row{height:42px;gap:9px}.social-row a,.social-row button{width:38px;height:38px;font-size:15px}.slider-wrap{height:clamp(118px,18vh,155px);margin-top:1px}.ads-title{display:none}.mini-inner{gap:7px;padding:5px 7px}.mini-logo{width:42px;height:42px}.eq{display:none}.mini-play{width:46px;height:46px}}
@media(max-height:680px){:root{--top:57px;--mini:72px}.content{padding-bottom:16px}.hero-logo{width:min(62%,270px);max-height:65%}.social-row{height:38px}.social-row a,.social-row button{width:34px;height:34px;font-size:13px}.slider-wrap{height:105px}.ads-title{display:none}.player-body{gap:12px;padding-top:12px}.disc-wrap{width:min(48vh,230px)}.main-play{width:65px;height:65px}}
</style>

<script>
(() => {
  const ogUrl=document.querySelector('meta[property="og:url"]'); if(ogUrl) ogUrl.content=location.href;

  const CONFIG={
    STREAM_URL:'https://stream.espora.org/radioteo',
    STATION_NAME:'Teo Páez Radio Online',
    LOGO:'https://i.ibb.co/DfD6THmT/Remover-fundo-5.png',
    SOCIAL:{
      facebook:'https://www.facebook.com/share/1JCv5CQTy4/',
      whatsapp:'https://wa.me/595976936516',
      tiktok:'https://www.tiktok.com/@teodoropaez0?_r=1&_t=ZN-99cAUH03hKs'
    }
  };

  const audio=document.getElementById('audio'), mini=document.getElementById('mini'), miniPlay=document.getElementById('miniPlay'), miniStatus=document.getElementById('miniStatus'), miniEq=document.getElementById('miniEq'), miniVol=document.getElementById('miniVol');
  const player=document.getElementById('player'), back=document.getElementById('back'), playBtn=document.getElementById('playBtn'), muteBtn=document.getElementById('muteBtn'), reloadBtn=document.getElementById('reloadBtn'), volume=document.getElementById('volume'), status=document.getElementById('status'), trackTitle=document.getElementById('trackTitle'), disc=document.getElementById('disc');
  let lastVolume=85, retryTimer=null;
  audio.volume=.85;

  function openPlayer(){player.classList.add('open');player.setAttribute('aria-hidden','false')}
  function closePlayer(){player.classList.remove('open');player.setAttribute('aria-hidden','true')}
  mini.addEventListener('click',e=>{if(e.target.closest('#miniPlay')){togglePlay();return}if(e.target.closest('#miniVol')){toggleMute();return}openPlayer()});
  back.addEventListener('click',closePlayer);

  function setUI(on){
    playBtn.innerHTML=on?'<i class="fa-solid fa-pause"></i>':'<i class="fa-solid fa-play"></i>';
    miniPlay.innerHTML=on?'<i class="fa-solid fa-pause"></i>':'<i class="fa-solid fa-play"></i>';
    disc.classList.toggle('spinning',on);miniEq.classList.toggle('paused',!on);
    miniStatus.textContent=on?'Sonando en vivo':'Listo para escuchar';
    status.textContent=on?'Transmitiendo en vivo':'Listo para escuchar';
  }
  function freshUrl(){return CONFIG.STREAM_URL+(CONFIG.STREAM_URL.includes('?')?'&':'?')+'_='+Date.now()}
  function load(){audio.src=freshUrl();audio.load()}
  async function start(){
    if(!CONFIG.STREAM_URL)return;
    status.textContent='Conectando…';miniStatus.textContent='Conectando…';load();
    try{await audio.play();setUI(true);trackTitle.textContent=CONFIG.STATION_NAME+' — En Vivo'}
    catch(e){status.textContent='No se pudo conectar';miniStatus.textContent='No se pudo conectar';setUI(false)}
  }
  function togglePlay(){if(audio.paused)start();else{audio.pause();setUI(false)}}
  function toggleMute(){if(audio.muted||audio.volume===0){audio.muted=false;audio.volume=lastVolume/100;volume.value=lastVolume;muteBtn.innerHTML='<i class="fa-solid fa-volume-high"></i>';miniVol.innerHTML='<i class="fa-solid fa-volume-high"></i>'}else{lastVolume=Number(volume.value)||85;audio.muted=true;audio.volume=0;volume.value=0;muteBtn.innerHTML='<i class="fa-solid fa-volume-xmark"></i>';miniVol.innerHTML='<i class="fa-solid fa-volume-xmark"></i>'}}
  playBtn.addEventListener('click',togglePlay);
  reloadBtn.addEventListener('click',()=>{const was=!audio.paused;audio.pause();setUI(false);if(was)start()});
  muteBtn.addEventListener('click',toggleMute);miniVol.addEventListener('click',toggleMute);
  volume.addEventListener('input',()=>{audio.muted=false;audio.volume=Number(volume.value)/100;lastVolume=Number(volume.value);muteBtn.innerHTML='<i class="fa-solid fa-volume-high"></i>';miniVol.innerHTML='<i class="fa-solid fa-volume-high"></i>'});
  audio.addEventListener('playing',()=>setUI(true));audio.addEventListener('pause',()=>setUI(false));audio.addEventListener('waiting',()=>{if(!audio.paused){status.textContent='Conectando…';miniStatus.textContent='Conectando…'}});audio.addEventListener('error',()=>{setUI(false);status.textContent='Señal temporalmente no disponible';miniStatus.textContent='Señal temporalmente no disponible';clearTimeout(retryTimer);retryTimer=setTimeout(()=>{if(!audio.paused)start()},4000)});

  // COMPARTIR: Web Share API + copia como respaldo
  async function shareApp(){
    const data={title:'Teo Páez Radio Online',text:'Escucha Teo Páez Radio Online en vivo.',url:location.href};
    try{if(navigator.share){await navigator.share(data)}else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);alert('Enlace de la radio copiado.')}}catch(e){}
  }
  document.getElementById('shareApp').addEventListener('click',e=>{e.stopPropagation();shareApp()});

  // CARRUSEL
  const slider=document.getElementById('slider'),wrap=document.getElementById('sliderWrap'),slides=[...slider.children],dots=document.getElementById('dots');let index=0,timer,startX=0;
  slides.forEach((_,i)=>{const d=document.createElement('button');d.className='dot-slide'+(i===0?' active':'');d.type='button';d.setAttribute('aria-label','Publicidad '+(i+1));d.onclick=()=>go(i);dots.appendChild(d)});
  function go(i){index=(i+slides.length)%slides.length;slider.style.transform='translateX(-'+index*100+'%)';[...dots.children].forEach((d,n)=>d.classList.toggle('active',n===index));restart()}
  function restart(){clearInterval(timer);timer=setInterval(()=>go(index+1),5000)}
  document.getElementById('next').onclick=e=>{e.stopPropagation();go(index+1)};document.getElementById('prev').onclick=e=>{e.stopPropagation();go(index-1)};
  wrap.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;clearInterval(timer)},{passive:true});wrap.addEventListener('touchend',e=>{const diff=e.changedTouches[0].clientX-startX;if(Math.abs(diff)>40)diff<0?go(index+1):go(index-1);else restart()},{passive:true});restart();

  // Evita scroll accidental en la vista principal, pero permite el player completo.
  document.addEventListener('touchmove',e=>{if(!e.target.closest('#player')&&!e.target.closest('input'))e.preventDefault()},{passive:false});

  // INTRO: el video nuevo es el intro; después el mismo video queda de fondo, muteado.
  const splash=document.getElementById('splash'), intro=document.getElementById('introVideo'), introStart=document.getElementById('startIntro'), startBtn=document.getElementById('startIntroBtn');let finished=false;
  function hideIntro(){if(finished)return;finished=true;intro.pause();splash.classList.add('hide');document.querySelector('.bg-video').play().catch(()=>{})}
  async function playIntro(){intro.currentTime=0;intro.muted=false;try{await intro.play();introStart.classList.remove('show')}catch(e){introStart.classList.add('show')}}
  intro.addEventListener('ended',hideIntro);intro.addEventListener('error',hideIntro);startBtn.addEventListener('click',()=>{introStart.classList.remove('show');playIntro()});
  // Siempre mostramos el intro; si el navegador bloquea audio, aparece el botón.
  playIntro();setTimeout(()=>{if(!finished)hideIntro()},10000);

  /* PWA — botón Instalar dentro del mini reproductor */
  const installApp=document.getElementById('installApp');
  let deferredPrompt=null;
  const standalone=()=>window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
  if(standalone()) installApp.style.display='none';
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();
    deferredPrompt=e;
    installApp.style.display='flex';
  });
  installApp.addEventListener('click',async e=>{
    e.stopPropagation();
    if(deferredPrompt){
      deferredPrompt.prompt();
      try{await deferredPrompt.userChoice}catch(_){}
      deferredPrompt=null;
      return;
    }
    if(standalone()) return;
    alert('Para instalar Teo Páez Radio: abre el menú de tu navegador y selecciona «Instalar aplicación» o «Añadir a pantalla de inicio».');
  });
  window.addEventListener('appinstalled',()=>{deferredPrompt=null;installApp.style.display='none'});

  /* Registrar el Service Worker para que la PWA sea instalable */
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }

  // Teclas útiles en escritorio
  document.addEventListener('keydown',e=>{if(e.code==='Space'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();togglePlay()}if(e.code==='Escape')closePlayer()});
})();
</script>
</body>
</html>
